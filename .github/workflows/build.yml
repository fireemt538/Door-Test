name: Build IPA
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project MillerDoor.xcodeproj -scheme MillerDoor -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/MillerDoor.app Payload/
          zip -r MillerDoor.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MillerDoor-ipa
          path: MillerDoor.ipa
