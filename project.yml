name: MillerDoor
options:
  bundleIdPrefix: com.miller
targets:
  MillerDoor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miller.millerdoor
        PRODUCT_NAME: MillerDoor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MillerDoor
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Talks to your door controller on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
